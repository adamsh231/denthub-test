<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DentHub &mdash; Quiet Dashboard Canvas</title>
  
  <!-- Premium Font Setup: Inter for modern clinical precision -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
  
  <!-- Tailwind CSS loaded dynamically for dev/fallback; Vite will build this statically -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'breathe-primary': 'breathe-primary 10s ease-in-out infinite',
            'breathe-secondary': 'breathe-secondary 10s ease-in-out infinite',
            'fade-in-title': 'fade-in-title 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'fade-in-subtitle': 'fade-in-subtitle 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'fade-in-ui': 'fade-in-ui 4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            'breathe-primary': {
              '0%, 100%': {
                transform: 'scale(0.85) translate(0px, 0px)',
                opacity: '0.3',
              },
              '45%, 55%': {
                transform: 'scale(1.15) translate(20px, -15px)',
                opacity: '0.85',
              },
            },
            'breathe-secondary': {
              '0%, 100%': {
                transform: 'scale(0.9) translate(0px, 0px) rotate(0deg)',
                opacity: '0.2',
              },
              '45%, 55%': {
                transform: 'scale(1.22) translate(-20px, 20px) rotate(12deg)',
                opacity: '0.65',
              },
            },
            'fade-in-title': {
              '0%': { opacity: '0', transform: 'translateY(16px)', filter: 'blur(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)', filter: 'blur(0px)' },
            },
            'fade-in-subtitle': {
              '0%, 40%': { opacity: '0', transform: 'translateY(12px)', filter: 'blur(6px)' },
              '100%': { opacity: '0.65', transform: 'translateY(0)', filter: 'blur(0px)' },
            },
            'fade-in-ui': {
              '0%, 60%': { opacity: '0', filter: 'blur(4px)' },
              '100%': { opacity: '1', filter: 'blur(0px)' },
            },
          },
        },
      },
    }
  </script>
</head>
<body class="h-full bg-[#FAF9F6] text-neutral-800 dark:bg-[#090B10] dark:text-neutral-100 overflow-hidden transition-colors duration-1000 select-none">

  <!-- Interactive/Adaptive Breathing Canvas Background -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
    <!-- Base Alabaster Overlay to keep gradients ultra-soft and low contrast -->
    <div class="absolute inset-0 bg-[#FAF9F6]/20 dark:bg-[#090B10]/20 z-10 backdrop-blur-[1px]"></div>
    
    <!-- Primary Breathing Color-Blob (Sage / Calm Teal) -->
    <div class="absolute top-[10%] left-[15%] w-[70vw] h-[70vw] max-w-[800px] max-h-[800px] rounded-full 
                bg-gradient-to-tr from-emerald-100/35 to-teal-100/25 
                dark:from-emerald-950/20 dark:to-teal-900/15 
                blur-[80px] sm:blur-[120px] mix-blend-multiply dark:mix-blend-screen 
                animate-breathe-primary"></div>
                
    <!-- Secondary Breathing Color-Blob (Soft Warm Sand / Rose Quartz) -->
    <div class="absolute bottom-[10%] right-[10%] w-[80vw] h-[80vw] max-w-[900px] max-h-[900px] rounded-full 
                bg-gradient-to-bl from-rose-100/30 to-amber-100/20 
                dark:from-purple-950/15 dark:to-rose-950/15 
                blur-[90px] sm:blur-[140px] mix-blend-multiply dark:mix-blend-screen 
                animate-breathe-secondary"></div>
  </div>

  <!-- Main Content Centerstage -->
  <div class="relative z-10 h-full flex flex-col justify-between p-8 sm:p-12">
    
    <!-- Ultra-Minimalist Invisible Header -->
    <header class="flex items-center justify-between w-full opacity-80 hover:opacity-100 transition-opacity duration-300">
      <div class="flex items-center gap-3">
        <span class="text-sm font-semibold tracking-widest uppercase text-neutral-400 dark:text-neutral-500">DentHub</span>
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400/80 dark:bg-emerald-500/80 animate-pulse"></span>
      </div>
      
      <!-- Time and Active Mode Indicator -->
      <div class="flex items-center gap-6 text-xs text-neutral-400 dark:text-neutral-500 font-light tracking-wide">
        <span id="live-time" class="hidden sm:inline">14:06 GMT+7</span>
        <div class="flex items-center gap-1.5">
          <span class="w-1 h-1 rounded-full bg-neutral-300 dark:bg-neutral-700"></span>
          <span>Calm Mode</span>
        </div>
      </div>
    </header>

    <!-- Center Stage Typography (Calm UI Fallback Screen) -->
    <main class="flex-1 flex flex-col items-center justify-center text-center px-4">
      <div class="max-w-xl">
        <h1 class="text-3xl sm:text-[42px] font-light tracking-tight leading-tight text-neutral-800 dark:text-neutral-100 mb-4 animate-fade-in-title">
          No appointments yet.
        </h1>
        <p class="text-base sm:text-lg font-light tracking-wide text-neutral-400/90 dark:text-neutral-500/90 animate-fade-in-subtitle">
          Enjoy the quiet.
        </p>
      </div>
    </main>

    <!-- Interactive Vibe / Settings Footer (Invisible UI style) -->
    <footer class="flex flex-col sm:flex-row items-center justify-between gap-4 w-full text-xs text-neutral-400 dark:text-neutral-500 font-light tracking-wide animate-fade-in-ui">
      
      <!-- Breathing Cycle Stats -->
      <div class="flex items-center gap-3 bg-neutral-200/30 dark:bg-neutral-900/30 border border-neutral-200/10 backdrop-blur-md px-3 py-1.5 rounded-full">
        <svg class="w-3.5 h-3.5 text-emerald-500/80 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
        </svg>
        <span>Breathing Cycle: <span class="font-medium text-neutral-600 dark:text-neutral-300">10s (6 bpm)</span></span>
      </div>

      <!-- Quick Context Control (Interactions without page jumps or modals) -->
      <div class="flex items-center gap-4">
        <!-- Interactive Theme Switcher (Invisible style) -->
        <button id="theme-toggle" class="px-3 py-1.5 rounded-full hover:bg-neutral-200/50 dark:hover:bg-neutral-800/50 text-neutral-500 dark:text-neutral-400 transition-all duration-300 active:scale-95 border border-transparent hover:border-neutral-200/20">
          <span class="dark:hidden">Switch to Dark Quiet</span>
          <span class="hidden dark:inline">Switch to Light Quiet</span>
        </button>
        
        <!-- Live Action Simulator to simulate new appointments (Morph target) -->
        <button id="simulate-appointment" class="px-4 py-1.5 rounded-full bg-neutral-800 text-[#FAF9F6] dark:bg-[#FAF9F6] dark:text-[#090B10] font-medium transition-all duration-300 active:scale-95 hover:opacity-90">
          Simulate Appointment
        </button>
      </div>
    </footer>

  </div>

  <script>
    // Live Time Clock (GMT+7 format)
    function updateClock() {
      const timeEl = document.getElementById('live-time');
      if (timeEl) {
        const now = new Date();
        // Force GMT+7 format display to match Bos Adam's timezone in USER.md
        const options = { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hour12: false };
        const timeStr = now.toLocaleTimeString('en-US', options);
        timeEl.textContent = `${timeStr} GMT+7`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Theme Switcher Logic
    const themeToggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;

    // Default to dark theme for peaceful night view unless user prefers light
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      htmlElement.classList.add('dark');
    } else {
      // Still default to dark for the ultimate calm aesthetic, but allow light
      htmlElement.classList.add('dark');
    }

    themeToggleBtn.addEventListener('click', () => {
      if (htmlElement.classList.contains('dark')) {
        htmlElement.classList.remove('dark');
        localStorage.setItem('color-theme', 'light');
      } else {
        htmlElement.classList.add('dark');
        localStorage.setItem('color-theme', 'dark');
      }
    });

    // Simulate Appointment click - morph animation demo (returns to timeline)
    const simulateBtn = document.getElementById('simulate-appointment');
    simulateBtn.addEventListener('click', () => {
      // Trigger a sleek fade-out layout exit and alert/simulate incoming appt
      const mainContainer = document.querySelector('main');
      mainContainer.style.transition = 'all 1s cubic-bezier(0.16, 1, 0.3, 1)';
      mainContainer.style.opacity = '0';
      mainContainer.style.transform = 'scale(0.96) translateY(-10px)';
      mainContainer.style.filter = 'blur(10px)';
      
      setTimeout(() => {
        alert("Incoming appointment request triggered! Morphing state to timeline view...");
        // Revert transition
        mainContainer.style.opacity = '1';
        mainContainer.style.transform = 'scale(1) translateY(0)';
        mainContainer.style.filter = 'blur(0px)';
      }, 1000);
    });
  </script>
</body>
</html>
